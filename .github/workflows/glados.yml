name: GLaDOS Auto Checkin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pypushdeer

      - name: Run checkin
        run: python checkin.py
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          COOKIES: ${{ secrets.COOKIES }}

      - name: Commit checkin log
        if: success()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "- $(date -u '+%Y-%m-%d %H:%M:%S UTC') checkin success" >> checkin-log.md
          git add checkin-log.md
          git diff --cached --quiet || git commit -m "checkin log $(date -u +%Y-%m-%d)"
          git push
